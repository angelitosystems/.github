<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F" />
      <stop offset="50%" stop-color="#0B1730" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <pattern id="cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38BDF8" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #94A3B8; }
    .stat-number { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #FFFFFF; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #E2E8F0; }
    .lang-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #F1F5F9; }
    .lang-pct { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #94A3B8; }
  </style>

  <!-- Container Box -->
  <rect width="850" height="360" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="850" height="360" rx="16" fill="url(#cardGrid)" />

  <!-- Subtle Top Ambient Glow -->
  <circle cx="200" cy="0" r="180" fill="#2563EB" opacity="0.12" filter="url(#cardGlow)" />
  <circle cx="750" cy="180" r="160" fill="#38BDF8" opacity="0.08" filter="url(#cardGlow)" />

  <!-- Header Section -->
  <g transform="translate(32, 32)">
    <!-- Org Hex Icon -->
    <rect width="40" height="40" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
    <path d="M20 10 L30 16 L30 28 L20 34 L10 28 L10 16 Z" fill="none" stroke="#60A5FA" stroke-width="2" />
    <circle cx="20" cy="22" r="3" fill="#60A5FA" />

    <text x="54" y="20" class="title">Angelito Systems · Organization Metrics</text>
    <text x="54" y="36" class="subtitle">Verified GitHub Organization · Engineering &amp; SaaS Architecture</text>
    
    <g transform="translate(640, 6)">
      <rect width="146" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="13" r="4" fill="#10B981" />
      <text x="24" y="17" class="badge-text">STATUS: ACTIVE</text>
    </g>
  </g>

  <!-- 4 KPI Cards -->
  <g transform="translate(32, 94)">
    <!-- KPI 1: Public Repositories -->
    <g transform="translate(0, 0)">
      <rect width="182" height="88" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <rect x="0" y="0" width="182" height="3" rx="1" fill="url(#blueAccent)" />
      <text x="18" y="44" class="stat-number">14+</text>
      <text x="18" y="68" class="stat-label">Public Repositories</text>
    </g>

    <!-- KPI 2: Primary Tech Ecosystem -->
    <g transform="translate(201, 0)">
      <rect width="182" height="88" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <rect x="0" y="0" width="182" height="3" rx="1" fill="url(#cyanAccent)" />
      <text x="18" y="44" class="stat-number">Full-Stack</text>
      <text x="18" y="68" class="stat-label">Web, Mobile &amp; API</text>
    </g>

    <!-- KPI 3: Architecture Focus -->
    <g transform="translate(402, 0)">
      <rect width="182" height="88" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <rect x="0" y="0" width="182" height="3" rx="1" fill="url(#purpleAccent)" />
      <text x="18" y="44" class="stat-number">Multi-Tenant</text>
      <text x="18" y="68" class="stat-label">SaaS &amp; Package Dev</text>
    </g>

    <!-- KPI 4: Enterprise Solutions -->
    <g transform="translate(604, 0)">
      <rect width="182" height="88" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <rect x="0" y="0" width="182" height="3" rx="1" fill="url(#emeraldAccent)" />
      <text x="18" y="44" class="stat-number">SUNAT / B2B</text>
      <text x="18" y="68" class="stat-label">Electronic Invoicing</text>
    </g>
  </g>

  <!-- Bottom Section: Tech Stack Distribution & Engineering Pillars -->
  <g transform="translate(32, 206)">
    <!-- Tech Breakdown Box -->
    <rect width="383" height="122" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
    <text x="18" y="28" class="title" font-size="14">Core Technologies Distribution</text>
    
    <!-- Multi-color Progress Bar -->
    <g transform="translate(18, 42)">
      <rect width="347" height="8" rx="4" fill="#1E293B" />
      <!-- TypeScript (45%) -->
      <rect x="0" width="156" height="8" rx="4" fill="#3178C6" />
      <!-- PHP / Laravel (35%) -->
      <rect x="159" width="121" height="8" rx="4" fill="#777BB4" />
      <!-- React / Inertia (12%) -->
      <rect x="283" width="41" height="8" rx="4" fill="#61DAFB" />
      <!-- Other / Tools (8%) -->
      <rect x="327" width="20" height="8" rx="4" fill="#10B981" />
    </g>

    <!-- Legend items -->
    <g transform="translate(18, 72)">
      <!-- Item 1 -->
      <circle cx="5" cy="5" r="4" fill="#3178C6" />
      <text x="16" y="9" class="lang-name">TypeScript / NestJS</text>
      <text x="142" y="9" class="lang-pct">45%</text>

      <!-- Item 2 -->
      <circle cx="190" cy="5" r="4" fill="#777BB4" />
      <text x="201" y="9" class="lang-name">PHP / Laravel 12</text>
      <text x="320" y="9" class="lang-pct">35%</text>

      <!-- Item 3 -->
      <circle cx="5" cy="30" r="4" fill="#61DAFB" />
      <text x="16" y="34" class="lang-name">React / Inertia</text>
      <text x="142" y="34" class="lang-pct">12%</text>

      <!-- Item 4 -->
      <circle cx="190" cy="30" r="4" fill="#10B981" />
      <text x="201" y="34" class="lang-name">Tools &amp; Extensions</text>
      <text x="320" y="34" class="lang-pct">8%</text>
    </g>

    <!-- Engineering Core Pillars Box -->
    <g transform="translate(403, 0)">
      <rect width="383" height="122" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <text x="18" y="28" class="title" font-size="14">Organization Standards &amp; Practices</text>

      <g transform="translate(18, 48)">
        <!-- Bullet 1 -->
        <circle cx="4" cy="4" r="3" fill="#60A5FA" />
        <text x="14" y="7" class="badge-text">Automated CI/CD &amp; GitHub Actions Quality Checks</text>

        <!-- Bullet 2 -->
        <circle cx="4" cy="26" r="3" fill="#38BDF8" />
        <text x="14" y="29" class="badge-text">Clean Code, Strict Typing &amp; Domain Architecture</text>

        <!-- Bullet 3 -->
        <circle cx="4" cy="48" r="3" fill="#A78BFA" />
        <text x="14" y="51" class="badge-text">Production-Tested Multi-Tenancy &amp; SaaS Workflows</text>
      </g>
    </g>
  </g>
</svg>
