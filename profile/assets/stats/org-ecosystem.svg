<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="auto">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F" />
      <stop offset="50%" stop-color="#0B1730" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <pattern id="ecoGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#60A5FA" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .eco-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .eco-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #94A3B8; }
    .repo-name { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 700; fill: #60A5FA; }
    .repo-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #CBD5E1; }
    .repo-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #94A3B8; }
  </style>

  <!-- Background -->
  <rect width="850" height="260" rx="16" fill="url(#ecoBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="850" height="260" rx="16" fill="url(#ecoGrid)" />

  <!-- Title -->
  <g transform="translate(32, 28)">
    <circle cx="6" cy="6" r="4" fill="#3B82F6" />
    <text x="20" y="10" class="eco-title">Core Architecture &amp; Solutions Ecosystem</text>
    <text x="20" y="26" class="eco-subtitle">Specialized open source modules and engineering frameworks developed by Angelito Systems</text>
  </g>

  <!-- 3 Repository / Framework Highlight Columns -->
  <g transform="translate(32, 74)">
    <!-- Card 1: Multi-Tenancy & Filament -->
    <g transform="translate(0, 0)">
      <rect width="250" height="154" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <rect x="0" y="0" width="250" height="3" rx="1" fill="#777BB4" />
      <g transform="translate(16, 20)">
        <text x="0" y="10" class="repo-name">filament-tenancy</text>
        <text x="0" y="32" class="repo-desc">Multi-database tenants + central</text>
        <text x="0" y="48" class="repo-desc">management for Filament PHP.</text>
        
        <g transform="translate(0, 70)">
          <rect width="48" height="20" rx="4" fill="#1E293B" />
          <text x="8" y="14" class="repo-tag">PHP</text>
          
          <rect x="54" width="70" height="20" rx="4" fill="#1E293B" />
          <text x="62" y="14" class="repo-tag">FILAMENT</text>

          <rect x="130" width="76" height="20" rx="4" fill="#1E293B" />
          <text x="138" y="14" class="repo-tag">DATABASE</text>
        </g>
      </g>
    </g>

    <!-- Card 2: Laravel 12 Enterprise Dashboard -->
    <g transform="translate(268, 0)">
      <rect width="250" height="154" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <rect x="0" y="0" width="250" height="3" rx="1" fill="#FF2D20" />
      <g transform="translate(16, 20)">
        <text x="0" y="10" class="repo-name">laravel-12-inertia</text>
        <text x="0" y="32" class="repo-desc">Enterprise access control template</text>
        <text x="0" y="48" class="repo-desc">powered by React &amp; Inertia.js.</text>

        <g transform="translate(0, 70)">
          <rect width="78" height="20" rx="4" fill="#1E293B" />
          <text x="8" y="14" class="repo-tag">LARAVEL 12</text>

          <rect x="84" width="58" height="20" rx="4" fill="#1E293B" />
          <text x="92" y="14" class="repo-tag">REACT</text>

          <rect x="148" width="60" height="20" rx="4" fill="#1E293B" />
          <text x="156" y="14" class="repo-tag">INERTIA</text>
        </g>
      </g>
    </g>

    <!-- Card 3: NestJS PDF & TypeScript SDKs -->
    <g transform="translate(536, 0)">
      <rect width="250" height="154" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
      <rect x="0" y="0" width="250" height="3" rx="1" fill="#3178C6" />
      <g transform="translate(16, 20)">
        <text x="0" y="10" class="repo-name">nestjs-pdf &amp; veloxis</text>
        <text x="0" y="32" class="repo-desc">Playwright enterprise PDF engine</text>
        <text x="0" y="48" class="repo-desc">&amp; modular HTTP/GraphQL client.</text>

        <g transform="translate(0, 70)">
          <rect width="74" height="20" rx="4" fill="#1E293B" />
          <text x="8" y="14" class="repo-tag">TYPESCRIPT</text>

          <rect x="80" width="60" height="20" rx="4" fill="#1E293B" />
          <text x="88" y="14" class="repo-tag">NESTJS</text>

          <rect x="146" width="62" height="20" rx="4" fill="#1E293B" />
          <text x="154" y="14" class="repo-tag">NODE.JS</text>
        </g>
      </g>
    </g>
  </g>
</svg>
